# secrets: stops a pipeline when a secret is in the Git history.
#
# What it does
#   Scans every commit with gitleaks, without internet. The report secrets.json
#   is kept as an artifact, with the values redacted.
#
# Put it early
#   Give it the first stage, so a leak stops the pipeline before anything is
#   built from it.
#
# How to read the result
#   Passed: "no leaks found" at the end of the log.
#   Failed: "leaks found", and the report says which file and commit. Deleting
#   the line is not enough: the secret is in the history, so replace it.
#   A known false positive goes in .gitleaks.toml in the project.
spec:
  description: >-
    Scans the whole Git history for secrets with gitleaks and fails when it
    finds one. Needs no internet.
  inputs:
    stage:
      default: test
      description: The pipeline stage this job runs in.
    gitleaks_image:
      default: zricethezav/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854
      description: The gitleaks image, pinned by digest.
---
secrets:
  stage: $[[ inputs.stage ]]
  image:
    name: $[[ inputs.gitleaks_image ]]
    entrypoint: [""]
  variables:
    # The whole history, not GitLab's shallow clone.
    GIT_DEPTH: "0"
  script:
    - gitleaks git . --redact --no-banner --report-format json --report-path secrets.json
  artifacts:
    when: always
    paths: [secrets.json]
